<svg class="dg" viewBox="0 0 360 442" role="img" aria-label="TCP と UDP" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">TCP と UDP</text>
<line x1="93.0" y1="96.0" x2="93.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="93.0" y1="200.0" x2="93.0" y2="246.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="93.0" y1="304.0" x2="93.0" y2="350.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="267.0" y1="96.0" x2="267.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="267.0" y1="186.0" x2="267.0" y2="246.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="267.0" y1="290.0" x2="267.0" y2="350.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="12.0" y="38.0" width="162.0" height="58" rx="8" class="dg-box key"/>
<text x="93.0" y="65.0" class="dg-txt" text-anchor="middle">TCP</text>
<text x="93.0" y="87.0" class="dg-sub" text-anchor="middle">①SYN（接続したい）</text>
<rect x="186.0" y="38.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="267.0" y="65.0" class="dg-txt" text-anchor="middle">UDP</text>
<text x="267.0" y="87.0" class="dg-sub" text-anchor="middle">接続を作らない</text>
<rect x="12.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="93.0" y="169.0" class="dg-txt" text-anchor="middle">②SYN+ACK</text>
<text x="93.0" y="191.0" class="dg-sub" text-anchor="middle">（いいよ）</text>
<rect x="186.0" y="142.0" width="162.0" height="44" rx="8" class="dg-box"/>
<text x="267.0" y="169.0" class="dg-txt" text-anchor="middle">いきなり送る</text>
<rect x="12.0" y="246.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="93.0" y="273.0" class="dg-txt" text-anchor="middle">③ACK＋データ</text>
<text x="93.0" y="295.0" class="dg-sub" text-anchor="middle">シーケンス番号つき</text>
<rect x="186.0" y="246.0" width="162.0" height="44" rx="8" class="dg-box"/>
<text x="267.0" y="273.0" class="dg-txt" text-anchor="middle">確認応答なし</text>
<rect x="12.0" y="350.0" width="162.0" height="58" rx="8" class="dg-box key"/>
<text x="93.0" y="377.0" class="dg-txt" text-anchor="middle">確認応答・再送</text>
<text x="93.0" y="399.0" class="dg-sub" text-anchor="middle">ウィンドウサイズで調整</text>
<rect x="186.0" y="350.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="267.0" y="377.0" class="dg-txt" text-anchor="middle">順序制御・再送なし</text>
<text x="267.0" y="399.0" class="dg-sub" text-anchor="middle">DNS・VoIPなど</text>
<text x="12" y="430.0" class="dg-note">シーケンス番号・確認応答番号・ウィンドウサイズはTCPだけ</text>
</svg>