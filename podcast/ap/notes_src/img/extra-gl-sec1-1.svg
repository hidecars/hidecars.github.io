<rect x="98.5" y="214.0" width="76" height="18" rx="4" class="dg-lbg"/><text x="136.5" y="227.0" class="dg-lbl" text-anchor="middle">取得して照合</text>
<line x1="180.0" y1="246.0" x2="267.0" y2="200.0" class="dg-edge dash" marker-end="url(#ah)"/>
<rect x="191.0" y="214.0" width="65" height="18" rx="4" class="dg-lbg"/><text x="223.5" y="227.0" class="dg-lbl" text-anchor="middle">問い合わせ</text>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">認証局（CA）</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">証明書を失効させる</text>
<rect x="12.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="93.0" y="169.0" class="dg-txt" text-anchor="middle">CRL</text>
<text x="93.0" y="191.0" class="dg-sub" text-anchor="middle">失効した証明書の一覧（署名つき）</text>
<rect x="186.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="267.0" y="169.0" class="dg-txt" text-anchor="middle">OCSP</text>
