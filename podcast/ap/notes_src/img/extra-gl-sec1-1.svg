<rect x="120.5" y="110.0" width="32" height="18" rx="4" class="dg-lbg"/><text x="136.5" y="123.0" class="dg-lbl" text-anchor="middle">発行</text>
<line x1="180.0" y1="96.0" x2="267.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="207.5" y="110.0" width="32" height="18" rx="4" class="dg-lbg"/><text x="223.5" y="123.0" class="dg-lbl" text-anchor="middle">回答</text>
