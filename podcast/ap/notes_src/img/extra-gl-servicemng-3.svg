<svg class="dg" viewBox="0 0 360 316" role="img" aria-label="バックアップ3方式と復元" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">バックアップ3方式と復元</text>
<line x1="180.0" y1="96.0" x2="93.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="180.0" y1="96.0" x2="267.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">フル</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">全部。復元はこれ1つ</text>
<rect x="12.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box key"/>
<text x="93.0" y="169.0" class="dg-txt" text-anchor="middle">差分</text>
<text x="93.0" y="191.0" class="dg-sub" text-anchor="middle">前回のフル以降。復元＝フル＋最新の差分</text>
<rect x="186.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="267.0" y="169.0" class="dg-txt" text-anchor="middle">増分</text>
<text x="267.0" y="191.0" class="dg-sub" text-anchor="middle">前回のバックアップ以降。復元＝フル＋全部の増分</text>
<rect x="12.0" y="246.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="273.0" class="dg-txt" text-anchor="middle">取得量・復元時間のちがい</text>
<text x="180.0" y="295.0" class="dg-sub" text-anchor="middle">差分は日ごとに増える／増分は少ないが復元に手間</text>
</svg>