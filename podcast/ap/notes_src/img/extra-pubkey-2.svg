<rect x="158.5" y="110.0" width="43" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="123.0" class="dg-lbl" text-anchor="middle">暗号化</text>
<line x1="180.0" y1="186.0" x2="180.0" y2="232.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="164.0" y="200.0" width="32" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="213.0" class="dg-lbl" text-anchor="middle">復号</text>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">Aさん（送信者）</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">Bの公開鍵で暗号化</text>
<rect x="12.0" y="142.0" width="336.0" height="44" rx="8" class="dg-box"/>
<text x="180.0" y="169.0" class="dg-txt" text-anchor="middle">暗号文</text>
