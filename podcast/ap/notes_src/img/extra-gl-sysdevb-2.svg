<svg class="dg" viewBox="0 0 360 220" role="img" aria-label="良い設計：強度は高く、結合度は低く" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">良い設計：強度は高く、結合度は低く</text>
<line x1="93.0" y1="96.0" x2="93.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="267.0" y1="96.0" x2="267.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="12.0" y="38.0" width="162.0" height="58" rx="8" class="dg-box key"/>
<text x="93.0" y="65.0" class="dg-txt" text-anchor="middle">モジュール強度</text>
<text x="93.0" y="87.0" class="dg-sub" text-anchor="middle">高いほど良い（最良：機能的強度）</text>
<rect x="186.0" y="38.0" width="162.0" height="58" rx="8" class="dg-box key"/>
<text x="267.0" y="65.0" class="dg-txt" text-anchor="middle">モジュール結合度</text>
<text x="267.0" y="87.0" class="dg-sub" text-anchor="middle">低いほど良い（最良：データ結合）</text>
<rect x="12.0" y="142.0" width="162.0" height="44" rx="8" class="dg-box risk"/>
<text x="93.0" y="169.0" class="dg-txt" text-anchor="middle">最悪：暗合的強度</text>
<rect x="186.0" y="142.0" width="162.0" height="44" rx="8" class="dg-box risk"/>
<text x="267.0" y="169.0" class="dg-txt" text-anchor="middle">最悪：内容結合</text>
<text x="12" y="208.0" class="dg-note">結合度の良い順：データ→スタンプ→制御→外部→共通→内容</text>
</svg>