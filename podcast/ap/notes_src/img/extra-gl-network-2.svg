<svg class="dg" viewBox="0 0 360 442" role="img" aria-label="伝送時間の計算手順" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">伝送時間の計算手順</text>
<line x1="180.0" y1="96.0" x2="180.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="180.0" y1="200.0" x2="180.0" y2="246.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="180.0" y1="304.0" x2="180.0" y2="350.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">データ量</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">バイト</text>
<rect x="12.0" y="142.0" width="336.0" height="58" rx="8" class="dg-box risk"/>
<text x="180.0" y="169.0" class="dg-txt" text-anchor="middle">×8 でビットに直す</text>
<text x="180.0" y="191.0" class="dg-sub" text-anchor="middle">ここを忘れると1/8</text>
<rect x="12.0" y="246.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="273.0" class="dg-txt" text-anchor="middle">÷（回線速度×伝送効率）</text>
<text x="180.0" y="295.0" class="dg-sub" text-anchor="middle">効率が示されたら先に掛ける</text>
<rect x="12.0" y="350.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="377.0" class="dg-txt" text-anchor="middle">伝送時間</text>
<text x="180.0" y="399.0" class="dg-sub" text-anchor="middle">秒</text>
<text x="12" y="430.0" class="dg-note">例：1Mバイト→800万ビット→÷5秒＝160万ビット/秒</text>
</svg>