<svg class="dg" viewBox="0 0 360 524" role="img" aria-label="ビット誤り率 → 誤りパケット数" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">ビット誤り率 → 誤りパケット数</text>
<line x1="180.0" y1="96.0" x2="180.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="180.0" y1="200.0" x2="180.0" y2="246.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="180.0" y1="304.0" x2="180.0" y2="350.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="180.0" y1="408.0" x2="180.0" y2="454.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">1パケットのバイト数</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">例 1,500バイト</text>
<rect x="12.0" y="142.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="169.0" class="dg-txt" text-anchor="middle">×8 ＝ ビット数</text>
<text x="180.0" y="191.0" class="dg-sub" text-anchor="middle">例 12,000ビット</text>
<rect x="12.0" y="246.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="273.0" class="dg-txt" text-anchor="middle">×ビット誤り率</text>
<text x="180.0" y="295.0" class="dg-sub" text-anchor="middle">％は100で割る。0.0001％＝100万分の1</text>
<rect x="12.0" y="350.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="377.0" class="dg-txt" text-anchor="middle">＝ 1パケットが誤る確率</text>
<text x="180.0" y="399.0" class="dg-sub" text-anchor="middle">例 0.012</text>
<rect x="12.0" y="454.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="481.0" class="dg-txt" text-anchor="middle">×パケット数 ＝ 誤りパケット数</text>
<text x="180.0" y="503.0" class="dg-sub" text-anchor="middle">例 10,000個 → 約120個</text>
</svg>