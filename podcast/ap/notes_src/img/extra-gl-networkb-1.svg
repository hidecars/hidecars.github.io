<svg class="dg" viewBox="0 0 360 442" role="img" aria-label="ARP：IPアドレス → MACアドレス" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">ARP：IPアドレス → MACアドレス</text>
<line x1="180.0" y1="96.0" x2="180.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="142.0" y="110.0" width="76" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="123.0" class="dg-lbl" text-anchor="middle">①問い合わせ</text>
<line x1="180.0" y1="200.0" x2="180.0" y2="246.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="180.0" y1="304.0" x2="180.0" y2="350.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="158.5" y="318.0" width="43" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="331.0" class="dg-lbl" text-anchor="middle">②返事</text>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">PC</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">相手のIP 192.168.1.20 のMACは？</text>
<rect x="12.0" y="142.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="169.0" class="dg-txt" text-anchor="middle">同じLANの全機器</text>
<text x="180.0" y="191.0" class="dg-sub" text-anchor="middle">ブロードキャストで問い合わせ</text>
<rect x="12.0" y="246.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="273.0" class="dg-txt" text-anchor="middle">該当する機器</text>
<text x="180.0" y="295.0" class="dg-sub" text-anchor="middle">私のMACは…（自分にだけ返事）</text>
<rect x="12.0" y="350.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="377.0" class="dg-txt" text-anchor="middle">ARPテーブル</text>
<text x="180.0" y="399.0" class="dg-sub" text-anchor="middle">結果をしばらく覚えておく</text>
<text x="12" y="430.0" class="dg-note">LANの外は、デフォルトゲートウェイ（ルータ）のMACを調べる</text>
</svg>