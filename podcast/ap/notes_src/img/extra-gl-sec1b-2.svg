<svg class="dg" viewBox="0 0 360 212" role="img" aria-label="境界防御 と ゼロトラスト" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">境界防御 と ゼロトラスト</text>
<line x1="93.0" y1="96.0" x2="93.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="267.0" y1="96.0" x2="267.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="12.0" y="38.0" width="162.0" height="58" rx="8" class="dg-box risk"/>
<text x="93.0" y="65.0" class="dg-txt" text-anchor="middle">境界防御</text>
<text x="93.0" y="87.0" class="dg-sub" text-anchor="middle">FWの内側は安全とみなす</text>
<rect x="186.0" y="38.0" width="162.0" height="58" rx="8" class="dg-box key"/>
<text x="267.0" y="65.0" class="dg-txt" text-anchor="middle">ゼロトラスト</text>
<text x="267.0" y="87.0" class="dg-sub" text-anchor="middle">内側でも毎回、認証・認可・ログ監視</text>
<rect x="12.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="93.0" y="169.0" class="dg-txt" text-anchor="middle">侵入されると</text>
<text x="93.0" y="191.0" class="dg-sub" text-anchor="middle">内部で横展開される</text>
<rect x="186.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="267.0" y="169.0" class="dg-txt" text-anchor="middle">侵入されても</text>
<text x="267.0" y="191.0" class="dg-sub" text-anchor="middle">一つずつ検証して広がりを抑える</text>
</svg>