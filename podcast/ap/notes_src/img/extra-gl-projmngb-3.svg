<line x1="180.0" y1="96.0" x2="267.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">縦軸＝残りの作業量／横軸＝日</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">計画線は右下がり</text>
