<rect x="12.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="93.0" y="169.0" class="dg-txt" text-anchor="middle">稼働ルータが故障</text>
<text x="93.0" y="191.0" class="dg-sub" text-anchor="middle">待機ルータが引き継ぐ</text>
<rect x="186.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box"/>
<text x="267.0" y="169.0" class="dg-txt" text-anchor="middle">一部のポートを止める</text>
