<svg class="dg" viewBox="0 0 360 338" role="img" aria-label="SAML：シングルサインオン" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">SAML：シングルサインオン</text>
<line x1="180.0" y1="96.0" x2="180.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="158.5" y="110.0" width="43" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="123.0" class="dg-lbl" text-anchor="middle">①認証</text>
<line x1="180.0" y1="200.0" x2="180.0" y2="246.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="136.5" y="214.0" width="87" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="227.0" class="dg-lbl" text-anchor="middle">②アサーション</text>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">利用者</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">1回だけ認証する</text>
<rect x="12.0" y="142.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="169.0" class="dg-txt" text-anchor="middle">IdP（認証する側）</text>
