<svg class="dg" viewBox="0 0 360 338" role="img" aria-label="ハイブリッド暗号" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">ハイブリッド暗号</text>
<line x1="180.0" y1="96.0" x2="93.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="180.0" y1="96.0" x2="267.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="93.0" y1="200.0" x2="180.0" y2="246.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="267.0" y1="200.0" x2="180.0" y2="246.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">送信者</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">一時的な共通鍵を作る</text>
<rect x="12.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box key"/>
<text x="93.0" y="169.0" class="dg-txt" text-anchor="middle">本文を共通鍵で暗号化</text>
<text x="93.0" y="191.0" class="dg-sub" text-anchor="middle">速い</text>
<rect x="186.0" y="142.0" width="162.0" height="58" rx="8" class="dg-box key"/>
<text x="267.0" y="169.0" class="dg-txt" text-anchor="middle">共通鍵を受信者の公開鍵で暗号化</text>
<text x="267.0" y="191.0" class="dg-sub" text-anchor="middle">鍵の受け渡しだけ公開鍵</text>
<rect x="12.0" y="246.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="273.0" class="dg-txt" text-anchor="middle">受信者</text>
<text x="180.0" y="295.0" class="dg-sub" text-anchor="middle">秘密鍵で共通鍵を取り出し、本文を復号</text>
<text x="12" y="326.0" class="dg-note">例：TLS・S/MIME</text>
</svg>