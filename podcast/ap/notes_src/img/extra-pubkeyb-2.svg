<svg class="dg" viewBox="0 0 360 442" role="img" aria-label="デジタル証明書の発行と検証" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">デジタル証明書の発行と検証</text>
<line x1="180.0" y1="96.0" x2="180.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="164.0" y="110.0" width="32" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="123.0" class="dg-lbl" text-anchor="middle">申請</text>
<line x1="180.0" y1="200.0" x2="180.0" y2="246.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="164.0" y="214.0" width="32" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="227.0" class="dg-lbl" text-anchor="middle">発行</text>
<line x1="180.0" y1="304.0" x2="180.0" y2="350.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="164.0" y="318.0" width="32" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="331.0" class="dg-lbl" text-anchor="middle">提示</text>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">Bさん</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">自分の公開鍵を申請</text>
<rect x="12.0" y="142.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="169.0" class="dg-txt" text-anchor="middle">認証局（CA）</text>
<text x="180.0" y="191.0" class="dg-sub" text-anchor="middle">CAの秘密鍵で署名して証明書を発行</text>
<rect x="12.0" y="246.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="273.0" class="dg-txt" text-anchor="middle">デジタル証明書</text>
<text x="180.0" y="295.0" class="dg-sub" text-anchor="middle">Bの公開鍵＋CAの署名</text>
<rect x="12.0" y="350.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="377.0" class="dg-txt" text-anchor="middle">Aさん</text>
<text x="180.0" y="399.0" class="dg-sub" text-anchor="middle">CAの公開鍵で署名を検証→Bの公開鍵は本物</text>
<text x="12" y="430.0" class="dg-note">失効の確認：CRL（一覧を取得）／OCSP（オンライン問い合わせ）</text>
</svg>