<rect x="147.5" y="304.0" width="65" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="317.0" class="dg-lbl" text-anchor="middle">文書＋署名</text>
<rect x="12.0" y="38.0" width="336.0" height="44" rx="8" class="dg-box"/>
