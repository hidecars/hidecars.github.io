<svg class="dg" viewBox="0 0 360 442" role="img" aria-label="起動の信頼の連鎖とサイドチャネル" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-ah"/></marker></defs>
<text x="180.0" y="26" class="dg-title" text-anchor="middle">起動の信頼の連鎖とサイドチャネル</text>
<line x1="180.0" y1="96.0" x2="180.0" y2="142.0" class="dg-edge" marker-end="url(#ah)"/>
<rect x="153.0" y="110.0" width="54" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="123.0" class="dg-lbl" text-anchor="middle">鍵・署名</text>
<line x1="180.0" y1="200.0" x2="180.0" y2="246.0" class="dg-edge" marker-end="url(#ah)"/>
<line x1="180.0" y1="350.0" x2="180.0" y2="96.0" class="dg-edge dash" marker-end="url(#ah)"/>
<rect x="164.0" y="214.0" width="32" height="18" rx="4" class="dg-lbg"/><text x="180.0" y="227.0" class="dg-lbl" text-anchor="middle">狙う</text>
<rect x="12.0" y="38.0" width="336.0" height="58" rx="8" class="dg-box key"/>
<text x="180.0" y="65.0" class="dg-txt" text-anchor="middle">TPM</text>
<text x="180.0" y="87.0" class="dg-sub" text-anchor="middle">鍵を外に出さず保管</text>
<rect x="12.0" y="142.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="169.0" class="dg-txt" text-anchor="middle">セキュアブート</text>
<text x="180.0" y="191.0" class="dg-sub" text-anchor="middle">起動時にOSローダーの署名を検証</text>
<rect x="12.0" y="246.0" width="336.0" height="58" rx="8" class="dg-box"/>
<text x="180.0" y="273.0" class="dg-txt" text-anchor="middle">OS・ソフト</text>
<text x="180.0" y="295.0" class="dg-sub" text-anchor="middle">改ざんされていなければ起動</text>
<rect x="12.0" y="350.0" width="336.0" height="58" rx="8" class="dg-box risk"/>
<text x="180.0" y="377.0" class="dg-txt" text-anchor="middle">サイドチャネル攻撃</text>
<text x="180.0" y="399.0" class="dg-sub" text-anchor="middle">処理時間・消費電力・電磁波から鍵を推測</text>
<text x="12" y="430.0" class="dg-note">防ぐ性質＝耐タンパ性（分解・読み出しに強い）</text>
</svg>